<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обновить FINANCE OS</title><style>body{font:16px/1.6 system-ui;max-width:460px;margin:10vh auto;padding:25px;background:#f6f5f1;color:#18211f}button{font:inherit;border:0;border-radius:12px;padding:14px 22px;background:#176b56;color:white;width:100%}</style><h1>FINANCE OS 2.0</h1><p>Эта страница обновляет только файлы приложения. Финансовая база не очищается.</p><p>Закройте другие вкладки FINANCE OS. После перехода новая версия предложит сохранить копию и перенести данные.</p><button id="go">Открыть обновлённое приложение</button><p id="status"></p><script>document.getElementById('go').onclick=async()=>{const s=document.getElementById('status');s.textContent='Проверяем обновление…';try{if('serviceWorker' in navigator){const r=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await r.update();const activate=()=>{if(r.waiting)r.waiting.postMessage({type:'ACTIVATE'});};activate();r.installing?.addEventListener('statechange',activate);r.addEventListener('updatefound',()=>r.installing?.addEventListener('statechange',activate));}setTimeout(()=>location.replace('./index.html?version=2.0.0'),1800);}catch(e){s.textContent='Не удалось обновить кеш. '+e.message;}};</script></html>
