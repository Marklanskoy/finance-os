</style></head><body><a class="skip" href="#main">К содержимому</a><div id="app"><main class="onboard"><h1>FINANCE OS</h1><p class="intro">Открываем вашу базу…</p><p class="fine">Приложение запускается по ссылке на сайт, не через предпросмотр HTML в «Файлах». Не очищайте данные браузера.</p></main></div><noscript>Для работы приложения нужен JavaScript.</noscript><dialog id="dialog"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script>'use strict';
(()=>{
const C=(()=>{
/* FINANCE OS 2.0 — domain rules. Amounts are integer minor units, never floats. */

function dateString(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function money(s,{signed=false,empty=false}={}){
 s=String(s??'').trim();
 if(/[\s\u00a0\u202f]/.test(s))assert(/^-?\d{1,3}(?:[ \u00a0\u202f]\d{3})+(?:[.,]\d{1,2})?$/.test(s),'Проверьте разделители тысяч в сумме');
 s=s.replace(/[\s\u00a0\u202f]/g,'').replace(',','.');
 if(!s&&empty)return 0;
 assert(new RegExp(signed?'^-?\\d+(?:\\.\\d{1,2})?$':'^\\d+(?:\\.\\d{1,2})?$').test(s),'Введите сумму: например 1500 или 1500,50. Не более двух знаков после запятой.');
 const negative=s.startsWith('-');if(negative)s=s.slice(1);const [whole,part='']=s.split('.');
 const n=BigInt(whole)*100n+BigInt(part.padEnd(2,'0'));assert(n<=BigInt(MAX),'Сумма превышает допустимый диапазон');return Number(negative?-n:n);
}
function inputMoney(n){return `${n<0?'-':''}${Math.trunc(Math.abs(n)/100)}${n%100?','+String(Math.abs(n)%100).padStart(2,'0'):''}`;}
function fmt(n,cur='KZT'){assert(Number.isSafeInteger(n),'Неверная денежная сумма');const a=Math.abs(n);return (n<0?'−':'')+Math.trunc(a/100).toLocaleString('ru-RU')+(a%100?','+String(a%100).padStart(2,'0'):'')+' '+SYMBOLS[cur];}
function sum(a){let n=0;for(const v of a){assert(Number.isSafeInteger(v),'Неверная денежная сумма');n+=v;assert(Number.isSafeInteger(n)&&Math.abs(n)<=MAX,'Итог превышает допустимый диапазон');}return n;}
function initial(currency='KZT',name=''){return {schema:2,revision:0,currency,name,accounts:[],transactions:[],budgets:[],goals:[],allocations:[],debts:[],categories:[...CATEGORIES],settings:{theme:'system',pin:null},migration:null};}
const active=t=>!t.deleted;
function posted(t,asOf=today()){return !t.deleted&&t.status==='posted'&&t.date<=asOf;}
function effect(t,accountId){
 if(!active(t))return 0;
 if(t.kind==='transfer')return t.accountId===accountId?-(t.amount+(t.fee||0)):t.toAccountId===accountId?t.amount:0;
 if(t.accountId!==accountId)return 0;
 return ['income','refund'].includes(t.kind)?t.amount:t.kind==='adjustment'?t.amount:-(t.amount+(t.interest||0));
}
function accountBalance(s,id,asOf=today(),includePlanned=false){const a=s.accounts.find(x=>x.id===id);assert(a,'Счёт не найден');return sum([a.opening,...s.transactions.filter(t=>!t.deleted&&t.date<=asOf&&(t.status==='posted'||includePlanned)).map(t=>effect(t,id))]);}
function total(s,asOf=today(),planned=false){return sum(s.accounts.map(a=>accountBalance(s,a.id,asOf,planned)));}
function reserved(s,filter={}){return sum(s.allocations.filter(a=>(!filter.accountId||a.accountId===filter.accountId)&&(!filter.goalId||a.goalId===filter.goalId)).map(a=>a.amount));}
function debtBalance(s,id,asOf=today()){const d=s.debts.find(x=>x.id===id);assert(d,'Долг не найден');return d.principal-sum(s.transactions.filter(t=>posted(t,asOf)&&t.kind==='debt'&&t.debtId===id).map(t=>t.amount));}
function debtDue(s,d,date=today()){
 const m=date.slice(0,7);if(d.openingDate>monthEnd(m))return null;
 const previous=plusDays(m+'-01',-1);
 const atStart=debtBalance(s,d.id,previous);
 const paid=sum(s.transactions.filter(t=>posted(t,date)&&t.kind==='debt'&&t.debtId===d.id&&t.date.startsWith(m)).map(t=>t.amount));
 const planned=sum(s.transactions.filter(t=>!t.deleted&&t.status==='planned'&&t.kind==='debt'&&t.debtId===d.id&&t.date<=monthEnd(m)).map(t=>t.amount));
 const needed=Math.max(0,Math.min(d.payment,atStart)-paid-planned);
 return needed>0?{id:'due-'+d.id,debtId:d.id,title:d.name,amount:needed,date:dayInMonth(m,d.day),synthetic:true}:null;
}
function upcoming(s,date=today()){
 const end=monthEnd(date.slice(0,7));
 const plans=s.transactions.filter(t=>!t.deleted&&t.status==='planned'&&t.date<=end).map(t=>({id:t.id,title:t.note||t.category||t.kind,amount:['income','refund'].includes(t.kind)?-t.amount:t.kind==='transfer'?(t.fee||0):t.kind==='adjustment'?-t.amount:t.amount+(t.interest||0),date:t.date,synthetic:false}));
 return [...plans,...s.debts.map(d=>debtDue(s,d,date)).filter(Boolean)].sort((a,b)=>a.date.localeCompare(b.date));
}
function overview(s,m=today().slice(0,7),asOf=today()){
 const tx=s.transactions.filter(t=>posted(t,asOf)&&t.date.startsWith(m));
 const inc=sum(tx.filter(t=>t.kind==='income').map(t=>t.amount));
 const cats=new Map();const add=(c,n)=>cats.set(c,sum([cats.get(c)||0,n]));
 for(const t of tx){
  if(t.kind==='expense')add(t.category,t.amount);
  if(t.kind==='refund'){const p=s.transactions.find(p=>p.id===t.parentId);add(p?.category||t.category||'Возвраты',-t.amount);}
  if(t.kind==='transfer'&&t.fee)add('Комиссии',t.fee);
  if(t.kind==='debt'){add('Погашение долга',t.amount);if(t.interest)add('Проценты',t.interest);}
 }
 const out=sum([...cats.values()]);
 const cash=total(s,asOf);const allocations=reserved(s);const due=upcoming(s,asOf);
 const committed=sum(due.filter(x=>x.amount>0).map(x=>x.amount));
 return {cash,inc,out,categories:[...cats].sort((a,b)=>b[1]-a[1]),reserved:allocations,committed,available:sum([cash,-allocations,-committed]),upcoming:due,
 underfunded:s.accounts.filter(a=>reserved(s,{accountId:a.id})>Math.max(0,accountBalance(s,a.id,asOf)))};
}
function availableCategories(s){return [...new Set([...s.categories,...s.transactions.filter(active).map(t=>t.category).filter(Boolean),'Комиссии','Погашение долга','Проценты'])];}
function integer(n,sign=false){assert(Number.isSafeInteger(n)&&Math.abs(n)<=MAX&&(sign||n>=0),'Некорректная денежная сумма');}
function text(s,max=200){assert(typeof s==='string'&&s.trim().length>0&&s.length<=max,'Название пустое или слишком длинное');}
function unique(a,label){const set=new Set();for(const x of a){assert(x&&typeof x.id==='string'&&x.id.length>0&&x.id.length<100&&!set.has(x.id),'Повторяющийся или неверный ID: '+label);set.add(x.id);}return set;}
function validate(s){
 assert(s&&s.schema===2&&SYMBOLS[s.currency]&&Number.isSafeInteger(s.revision)&&s.revision>=0,'Несовместимый формат базы');
 for(const k of ['accounts','transactions','budgets','goals','allocations','debts','categories'])assert(Array.isArray(s[k])&&s[k].length<=100000,'Неверный раздел: '+k);
 if(s.migration)assert(Array.isArray(s.migration.warnings)&&s.migration.warnings.every(w=>typeof w==='string'&&w.length<3000),'Неверные сведения о переносе');
 assert(typeof s.name==='string'&&s.name.length<=100,'Неверное имя');
 assert(s.settings&&['system','light','dark'].includes(s.settings.theme),'Неверные настройки');
 if(s.settings.pin){const p=s.settings.pin;assert(['legacy','v2'].includes(p.mode)&&/^[a-f0-9]{64}$/.test(p.hash)&&typeof p.salt==='string'&&p.salt.length<=100,'Неверная блокировка');}
 s.categories.forEach(c=>text(c,80));
 const accounts=unique(s.accounts,'счета'),ts=unique(s.transactions,'операции'),goals=unique(s.goals,'цели'),debts=unique(s.debts,'долги');
 const txIndex=new Map(s.transactions.map(t=>[t.id,t])),debtIndex=new Map(s.debts.map(d=>[d.id,d])),refundTotals=new Map(),debtTotals=new Map();unique(s.budgets,'бюджеты');unique(s.allocations,'резервы');
 for(const a of s.accounts){text(a.name,80);integer(a.opening,true);assert(typeof a.archived==='boolean','Неверный счёт');}
 for(const d of s.debts){text(d.name,100);integer(d.principal);integer(d.payment);assert(d.principal>=0&&(d.payment>0||d.principal===0)&&Number.isInteger(d.day)&&d.day>=1&&d.day<=31&&isDate(d.openingDate),'Неверные параметры долга');}
 for(const g of s.goals){text(g.name,100);integer(g.target);integer(g.monthly||0);integer(g.legacySaved||0);assert(g.target>0&&(!g.deadline||isDate(g.deadline)),'Неверные параметры цели');}
 const budgetKeys=new Set();for(const b of s.budgets){text(b.category,80);integer(b.limit);assert(b.limit>0&&isDate(b.month+'-01'),'Неверный лимит');const key=b.month+'|'+b.category;assert(!budgetKeys.has(key),'Лимит этой категории уже существует');budgetKeys.add(key);}
 for(const t of s.transactions){
  assert(t.deleted===undefined||typeof t.deleted==='boolean','Неверный статус удаления');
  assert(['income','expense','transfer','refund','debt','adjustment'].includes(t.kind),'Неизвестный тип операции');assert(['posted','planned'].includes(t.status)&&isDate(t.date),'Неверная дата или статус');
  assert(accounts.has(t.accountId),'Счёт операции не найден');integer(t.amount,t.kind==='adjustment');assert(t.amount!==0,'Сумма должна быть ненулевой');integer(t.fee||0);integer(t.interest||0);
  assert(typeof t.note==='string'&&t.note.length<=1000&&typeof t.category==='string'&&t.category.length<=80,'Неверное описание операции');
  if(t.kind==='transfer')assert(accounts.has(t.toAccountId)&&t.toAccountId!==t.accountId,'Выберите другой счёт для перевода');
  if(t.kind==='debt'){assert(debts.has(t.debtId),'Долг не найден');assert(t.date>=debtIndex.get(t.debtId).openingDate,'Платёж раньше начала учёта долга');}
  if(t.kind==='refund'&&!t.deleted){const p=txIndex.get(t.parentId);assert(p&&!p.deleted&&p.kind==='expense'&&p.status==='posted'&&p.date<=t.date,'Выберите действующую покупку для возврата');refundTotals.set(t.parentId,sum([refundTotals.get(t.parentId)||0,t.amount]));}

 }
 for(const t of s.transactions.filter(t=>!t.deleted&&t.kind==='expense')){const refunded=refundTotals.get(t.id)||0;assert(refunded<=t.amount,'Возвраты превышают сумму покупки');}
 for(const d of s.debts){assert((debtTotals.get(d.id)||0)<=d.principal,'Платежи превышают остаток долга');}

 total(s);reserved(s);for(const m of new Set(s.transactions.map(t=>t.date.slice(0,7)))){const es=s.transactions.filter(t=>!t.deleted&&t.date.startsWith(m));sum(es.map(t=>Math.abs(t.amount)));}
 return s;
}
function putTransaction(s,t){
 assert(t.status!=='posted'||t.date<=today(),'Будущую операцию сохраните как запланированную');

 if(t.category&&!s.categories.includes(t.category))s.categories.push(t.category);

function allocate(s,{goalId,accountId,amount,date=today()}){

 if(amount>0)assert(amount<=Math.max(0,accountBalance(s,accountId)-reserved(s,{accountId})),'На этом счёте недостаточно незарезервированных денег');
 else assert(current+amount>=0,'Нельзя освободить больше, чем выделено на этом счёте');

function parseQuick(text,date=today()){
 const original=text.trim();let s=original,kind=/зарплата|доход|получил|поступлен/iu.test(s)?'income':'expense';
 const currency=/(?:usd|доллар)/iu.test(s)||/\$/.test(s)?'USD':/(?:eur|евро)/iu.test(s)||/€/.test(s)?'EUR':/(?:rub|руб)/iu.test(s)||/₽/.test(s)?'RUB':/\b(?:kzt)/iu.test(s)||/тенге|₸/iu.test(s)?'KZT':null;
 const nums=[...s.matchAll(/\d+(?:[\s\u00a0]\d{3})*(?:[.,]\d{1,2})?/g)];assert(nums.length===1,'Укажите одну сумму. Дату можно задать словом «вчера», «сегодня» или «завтра».');
 const amt=money(nums[0][0]);assert(amt>0,'Сумма должна быть больше нуля');
