# Optional Render Blueprint for the standalone AI-Server repository.
# Requires PAID compute + persistent disk. Review charges before creating.
# This file contains NO secrets. Enter them in Render, never in GitHub.
services:
  - type: web
    name: finance-os-ai
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /v1/health
    autoDeployTrigger: off
    disk:
      name: access-codes
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: AUTH_DB
        value: /var/data/auth.sqlite3
      - key: ALLOWED_ORIGINS
        value: https://marklanskoy.github.io
      - key: USER_DAILY_LIMIT
        value: '30'
      - key: GLOBAL_DAILY_LIMIT
        value: '200'
      - key: GLOBAL_MONTHLY_LIMIT
        value: '3000'
